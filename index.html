<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Bench — CLN4U Review Arena</title>
<meta name="description" content="Review games for CLN4U Canadian and International Law: Jeopardy, Wheel of Justice, Chief Justice and Lightning Round — solo or head-to-head, plus a Study Room.">
<meta name="theme-color" content="#0e0f14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Bench">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-unit="0" data-orient="auto">
<div class="bg-ornament" aria-hidden="true"></div>

<header class="topbar">
  <button class="brand" id="btnHome" aria-label="Home">
    <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 48 48"><use href="#ic-bench"/></svg></span>
    <span class="brand-text"><span class="brand-name">The Bench</span><span class="brand-sub">CLN4U Review Arena</span></span>
  </button>
  <div class="topbar-right">
    <button class="chip" id="btnProfile" title="Player profile"><svg class="ic"><use href="#ic-user"/></svg><span id="profileName">Player</span></button>
    <button class="icon-btn" id="btnStudy" title="Study Room"><svg class="ic"><use href="#ic-book"/></svg></button>
    <button class="icon-btn" id="btnLeaderboard" title="Leaderboard"><svg class="ic"><use href="#ic-trophy"/></svg></button>
    <button class="icon-btn" id="btnBadges" title="Badges, gates & accolades"><svg class="ic"><use href="#ic-badge"/></svg></button>
    <button class="icon-btn" id="btnFs" title="Fullscreen"><svg class="ic"><use href="#ic-fullscreen"/></svg></button>
    <button class="icon-btn" id="btnInstall" title="Install app" hidden><svg class="ic"><use href="#ic-download"/></svg></button>
  </div>
</header>

<main id="app" class="app"></main>

<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="modal" class="modal" hidden></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
